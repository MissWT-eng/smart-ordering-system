name: Build and frontend checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # contextLoads is a separate integration check requiring real application dependencies.
      - name: Run isolated Java tests
        run: bash ./mvnw -B '-Dtest=RecommendationRequestValidationTest,AgentChatStreamSessionTest,AgentChatStreamingControllerTest' test

      - name: Run frontend unit tests
        run: node --test src/test/frontend/agent-client.test.mjs src/test/frontend/draft-revision.test.mjs src/test/frontend/order-lookup.test.mjs

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          node --check src/main/resources/static/user-frontend/agent.js
          node --check src/main/resources/static/user-frontend/app.js
          for module in src/main/resources/static/user-frontend/*.mjs; do
            node --check "$module"
          done
