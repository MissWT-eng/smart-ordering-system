spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smart_ordering?serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.luwei.ordering.common.typehandler.CodeEnumTypeHandler
